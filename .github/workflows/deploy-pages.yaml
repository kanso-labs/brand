name: Deploy pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Pages publishes one deployment at a time. Queue rather than cancel, so the
# last push to main is the one that ends up published.
concurrency:
  cancel-in-progress: false
  group: pages

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # The build needs only resvg and fflate, both prebuilt, so no install
      # script has anything to do.
      - name: Set up Node
        uses: kanso-labs/actions/setup-node@v4.7.0
        with:
          ignore-scripts: true

      - name: Build the site
        run: npm run build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  # Pull requests build but do not publish, so a change that no longer builds
  # is caught while it is still someone's branch rather than on main.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
